<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Exile Compass · Quests</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="overlay.css">
  <link rel="stylesheet" href="lists.css">
</head>
<body>
  <div class="win">
    <header class="bar">
      <span class="bar-title">Quests</span>
      <nav class="tabs no-drag" role="tablist">
        <button class="tab active" data-tab="points" role="tab" aria-selected="true">Passive points</button>
        <button class="tab" data-tab="lab" role="tab" aria-selected="false">Labyrinth</button>
      </nav>
      <span class="bar-spacer"></span>
      <button class="close" id="close" aria-label="Close">×</button>
    </header>

    <div class="summary" id="summary">
      <span id="progress"></span>
      <button id="reset" class="small">Clear ticks</button>
    </div>

    <main class="scroll list" id="points"></main>
    <main class="scroll list" id="lab" hidden></main>
  </div>
  <script src="quests.js"></script>
</body>
</html>
